name: Deploy infinite-canvas to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: web
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps --include=optional

      - name: Build
        working-directory: web
        run: npm run build

      - name: Ensure SPA fallback (_redirects)
        working-directory: web
        run: test -f dist/_redirects || printf '/* /index.html 200\n' > dist/_redirects

      - name: Copy Cloudflare Functions, custom SW, and proxy management page into build output
        run: |
          rm -rf web/dist/functions
          cp -r functions web/dist/functions
          if [ -f sw.js ]; then cp sw.js web/dist/sw.js; else echo "::warning::sw.js not found at repo root, skipping (custom service worker not deployed)"; fi
          if [ -f proxy-manage.html ]; then cp proxy-manage.html web/dist/proxy-manage.html; else echo "::warning::proxy-manage.html not found at repo root, skipping"; fi

      - name: Deploy to Cloudflare Pages
        working-directory: web
        run: npx wrangler pages deploy dist --project-name=infinite-canvas --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
